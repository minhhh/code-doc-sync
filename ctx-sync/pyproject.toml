[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ctx-sync"
version = "0.1.0"
description = "Two-way merge for CONTEXT.md: refresh machine blocks, preserve human notes"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "code-doc-sync" }]
keywords = ["context", "documentation", "code-graph", "static-analysis"]
dependencies = ["typer>=0.12,<1"]

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.10", "ruff>=0.5", "pre-commit>=4"]

[project.scripts]
ctx-sync = "ctxsync.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/ctxsync"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = false
follow_imports = "skip"
ignore_missing_imports = true
